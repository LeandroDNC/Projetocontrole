<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EclesiaSync — Gestão Eclesiástica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOGIN -->
  <div id="screen-login">
    <div class="login-split login-single">

      <div class="login-card">
        <div class="login-card-inner">
          <div class="login-mob-emblem" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M24 4v10M18 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M9 44V21l15-11 15 11v23H9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M19 44V30h10v14" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1 class="login-brand-name">EclesiaSync</h1>
          <h2 class="login-form-title">Entrar</h2>
          <p class="login-form-sub">Use suas credenciais para acessar o painel.</p>
          <div class="form-group">
            <label for="inp-user">Usuário</label>
            <div class="input-wrapper">
              <i data-lucide="user" class="input-icon"></i>
              <input id="inp-user" type="text" placeholder="Digite seu usuário" autocomplete="username"
                autocapitalize="none" autocorrect="off" spellcheck="false" />
            </div>
          </div>
          <div class="form-group">
            <label for="inp-pass">Senha</label>
            <div class="input-wrapper">
              <i data-lucide="lock" class="input-icon"></i>
              <input id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
              <button type="button" class="pass-toggle" id="pass-toggle" aria-label="Mostrar senha" aria-pressed="false">
                <i data-lucide="eye" class="pass-toggle-icon icon-show"></i>
                <i data-lucide="eye-off" class="pass-toggle-icon icon-hide"></i>
              </button>
            </div>
          </div>
          <p id="login-err" class="login-err-msg hidden" role="alert" aria-live="assertive"></p>
          <button id="btn-login" class="btn btn-primary btn-full">
            <i data-lucide="log-in" class="btn-icon"></i>
            <span>Entrar no Sistema</span>
          </button>
          <p class="login-foot-note">Acesso restrito à administração e liderança</p>
        </div>
      </div>

    </div>
  </div>

  <!-- APP -->
  <div id="screen-app" class="hidden">
    <div class="mob-overlay" id="mob-overlay"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-text">
          <h2>EclesiaSync</h2>
          <p>Gestão Eclesiástica</p>
        </div>
        <div class="sidebar-toggle" id="sidebar-toggle" title="Recolher">
          <i data-lucide="chevron-left" style="width:14px;height:14px"></i>
        </div>
      </div>
      <div class="sidebar-nav">
        <div class="nav-label">Principal</div>
        <div class="nav-item active" data-page="dashboard"><span class="nav-icon"><i
              data-lucide="layout-dashboard"></i></span><span class="nav-lbl">Dashboard</span></div>
        <div class="nav-item" data-page="setores"><span class="nav-icon"><i data-lucide="map-pin"></i></span><span
            class="nav-lbl">Setores</span></div>
        <div class="nav-item" data-page="usuarios"><span class="nav-icon"><i data-lucide="users"></i></span><span
            class="nav-lbl">Usuários</span></div>
        <div class="nav-item" data-page="relatorios"><span class="nav-icon"><i
              data-lucide="bar-chart-3"></i></span><span class="nav-lbl">Relatórios</span></div>
        <div class="nav-item" data-page="calendario"><span class="nav-icon"><i
              data-lucide="calendar-days"></i></span><span class="nav-lbl">Calendário</span></div>

        <div class="nav-label">Análise</div>
        <div class="nav-item" data-page="frequencia"><span class="nav-icon"><i
              data-lucide="trending-up"></i></span><span class="nav-lbl">Frequência</span></div>
        <!-- Ranking injetado via ranking_module.js -->
        <div class="nav-label">Sistema</div>
        <div class="nav-item" data-page="permissoes"><span class="nav-icon"><i
              data-lucide="shield-check"></i></span><span class="nav-lbl">Permissões</span></div>
        <!-- Financeiro injetado via financeiro_module.js -->
      </div>
      <div class="sidebar-footer">
        <div class="user-pill" id="user-pill">
          <div class="user-av" id="user-av"></div>
          <div class="user-inf">
            <strong id="user-name-side"></strong>
            <span class="role-badge" id="user-role-side"></span>
            <span class="user-setor-side" id="user-setor-side"></span>
          </div>
        </div>
      </div>
    </nav>
    <div class="main" id="main-wrap">
      <header class="topbar">
        <button class="hamburger" id="hamburger"><i data-lucide="menu"></i></button>
        <div class="topbar-title">
          <span class="topbar-title-row">
            <span id="page-title">Dashboard</span>
            <button class="help-trigger" id="help-trigger" onclick="openHelpCenter()" title="Central de Ajuda" aria-label="Abrir central de ajuda">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 2-2.4 3.5"/>
                <path d="M12 17.5v.01"/>
              </svg>
            </button>
          </span>
          <small id="topbar-date"></small>
        </div>
        <div id="theme-panel-container"></div>
        <div class="topbar-user-wrap">
          <span class="topbar-user-av" id="topbar-user-av"></span>
          <span class="fs-sm c2 fw5" id="topbar-user"></span>
        </div>
      </header>
      <div class="page" id="page-content"></div>
    </div>
  </div>
  <div id="modal-container"></div>

  <!-- CENTRAL DE AJUDA -->
  <div id="help-center" class="help-center hidden" role="dialog" aria-modal="true" aria-label="Central de Ajuda" onclick="helpOverlayClick(event)">
    <div class="help-panel" onclick="event.stopPropagation()">
      <div class="help-topbar">
        <button class="help-icon-btn hidden" id="help-back-btn" onclick="helpBack()" aria-label="Voltar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="help-search-wrap">
          <svg class="help-search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="help-search-input" placeholder="Buscar artigos ou funcionalidades..." oninput="helpSearch(this.value)" autocomplete="off"/>
        </div>
        <button class="help-icon-btn" onclick="closeHelpCenter()" aria-label="Fechar central de ajuda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="help-body" id="help-body"></div>
    </div>
  </div>

  <!--
    app.js = script_v5.js + financeiro_module.js + ranking_module.js +
    dashboard_patch.js + adicao.js + ajuste.js + patch_umadalpe_eventos.js,
    concatenados nessa ordem exata (cada bloco pode sobrescrever funções
    do bloco anterior — a ordem interna do arquivo importa tanto quanto
    a ordem dos <script> importava antes; não reordenar os blocos).
  -->
  <script src="app.js"></script>

  <script>
    // Inicializa ícones Lucide após todos os scripts carregarem
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });

    // Mostrar/ocultar senha no login — puramente cosmético, não interfere
    // na leitura de #inp-pass.value feita por doLogin() em script_v5.js
    document.addEventListener('DOMContentLoaded', () => {
      const toggle = document.getElementById('pass-toggle');
      const input = document.getElementById('inp-pass');
      if (!toggle || !input) return;
      toggle.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.classList.toggle('active', show);
        toggle.setAttribute('aria-pressed', String(show));
        toggle.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
      });
    });
  </script>
</body>

</html>
